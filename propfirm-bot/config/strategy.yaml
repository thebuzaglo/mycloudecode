# Strategy / council configuration.

instrument:
  symbol: NQ
  tick_size: 0.25
  # $ per point per contract. 2.0 = MNQ (micro) — the sane default: with a
  # 0.5% risk budget a full NQ ($20/pt) rarely fits one ATR-stop contract.
  point_value: 2.0

# Timeframes the council sits on (TradingView interval strings: minutes).
timeframes: ["5", "15", "60"]
decision_timeframe: "5"  # entries are triggered on this TF's bar close

# Starting weights; the Learner adapts these on the fly (persisted in the DB).
# Seeded from a 60-day NQ train/validation run (scripts/tune.py, 2026-06-11):
# trend/breakout/slope earned weight, mean-reversion lost most of it.
member_weights:
  trend_ema: 2.4
  momentum_rsi: 1.4
  mean_reversion: 0.6
  breakout: 3.0
  slope: 2.7
timeframe_weights:
  "5": 1.25
  "15": 1.4
  "60": 1.95

# Tuned on the same split: positive expectancy on both train (+0.18R/26
# trades) and unseen validation (+0.42R/11 trades). Small samples — verify
# in paper mode before trusting.
params:
  entry_threshold: 0.4   # |council score| needed to fire
  stop_atr_mult: 1.5
  reward_risk: 2.0
  min_coverage: 0.5

correlation:
  references: [ES, YM, RTY]   # add DXY/ZN if you feed them alerts too
  timeframe: "5"
  window: 60
  min_multiplier: 0.4   # max attenuation when the complex disagrees
  boost: 0.15           # max boost when everything confirms

learning:
  eta: 0.10             # weight-update aggressiveness
  review_every: 20      # closed trades between parameter reviews

webhook:
  host: 0.0.0.0
  port: 8787
  secret: "CHANGE_ME"   # must match the `secret` field in your TV alerts

execution:
  mode: paper           # paper | webhook
  url: ""               # execution bridge URL when mode=webhook
  secret: ""
